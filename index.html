<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Card Maker</title>
<link rel="stylesheet" href="fonts.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--sf:#fff;--tx:#1b2b22;--mu:#6b7a72;--g:#145a32;--bd:#d9ddd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--sf:#1c2520;--tx:#e8efe9;--mu:#9aa9a0;--g:#3fa56a;--bd:#33403a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'HindLocal','Hind Siliguri',system-ui,sans-serif;font-size:16px}
.w{max-width:520px;margin:auto;padding:14px}h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
button,.btn{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:var(--g)}button.on{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:90px}.st{display:flex;gap:6px}.st button{flex:1;font-size:18px;padding:10px 0}
img.pv{width:100%;border-radius:12px;display:block}.logo{max-height:60px;display:block;margin:6px 0}
.row{display:flex;gap:8px}.row>*{flex:1}.hide{display:none}small{color:var(--mu)}
</style></head><body><div class="w">
<h1>⭐ Review Card Maker</h1>
<div class="tabs"><button id="t1" class="on">নতুন রিভিউ</button><button id="t2">সেটিংস</button></div>

<div id="p1">
<div class="c">
<label>কত স্টার?</label><div class="st" id="stars"></div>
<label>কাস্টমার কী বলেছে</label><textarea id="txt" placeholder="রিভিউ এখানে লিখুন"></textarea>
<label>কাস্টমারের নাম</label><input type="text" id="nm" placeholder="যেমন: Hashi">
<label>কাস্টমারের ছবি (ঐচ্ছিক)</label><input type="file" id="ph" accept="image/*">
<small id="phs"></small>
<div style="margin-top:12px"><button class="p" id="go" style="width:100%">কার্ড বানাও</button></div>
</div>
<div id="out" class="hide c">
<img id="img" class="pv" alt="card">
<small>ছবিতে চেপে ধরে রাখুন → "Save image / ছবি সংরক্ষণ"। অথবা নিচের বাটন ব্যবহার করুন।</small>
<div class="row" style="margin-top:8px"><button id="sh" class="p">শেয়ার / সেভ</button><button id="dl">ডাউনলোড</button></div>
</div></div>

<div id="p2" class="hide"><div class="c">
<label>বর্তমান লোগো</label><img id="lg" class="logo" alt="logo">
<input type="file" id="lgf" accept="image/*"><small>নতুন লোগো দিলে সেভ থাকবে।</small>
<label>ফুটার লাইন ১</label><input type="text" id="f1">
<label>ফুটার লাইন ২</label><input type="text" id="f2">
<label>ব্র্যান্ড কালার</label><input type="color" id="col" style="width:100%;height:44px">
<div style="margin-top:12px"><button class="p" id="sv" style="width:100%">সেভ করো</button></div>
</div></div>
</div>

 return new Promise(r=>$("cv").toBlob(r,"image/png"));
}
let blob=null;
$("go").onclick=async()=>{blob=await render();$("img").src=URL.createObjectURL(blob);$("out").classList.remove("hide");$("out").scrollIntoView({behavior:"smooth"})};
const fn=()=>"review-"+Date.now()+".png";
const NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const b64=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(b)});
async function nativeShare(){const FS=Capacitor.registerPlugin("Filesystem"),SH=Capacitor.registerPlugin("Share");
 const r=await FS.writeFile({path:fn(),data:await b64(blob),directory:"CACHE"});await SH.share({title:"Review Card",files:[r.uri]})}
$("sh").onclick=async()=>{try{if(NAT){await nativeShare();return}const f=new File([blob],fn(),{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}alert("ছবিতে চেপে ধরে রেখে Save করুন")};
$("dl").onclick=async()=>{try{if(NAT){const FS=Capacitor.registerPlugin("Filesystem");try{await FS.writeFile({path:"ANT-Reviews/"+fn(),data:await b64(blob),directory:"DOCUMENTS",recursive:true});alert("Documents/ANT-Reviews ফোল্ডারে সেভ হয়েছে ✅");return}catch(e){await nativeShare();return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn();document.body.appendChild(a);a.click();a.remove()}catch(e){}};
</script></body></html>
