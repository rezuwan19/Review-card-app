name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/
          curl -fL -o www/HindBold.ttf https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Bold.ttf || true
          curl -fL -o www/HindMedium.ttf https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Medium.ttf || true
          cat > www/fonts.css <<'EOF'
          @font-face{font-family:'HindLocal';font-weight:700;src:url(HindBold.ttf)}
          @font-face{font-family:'HindLocal';font-weight:500;src:url(HindMedium.ttf)}
          EOF
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/filesystem@7
          npx cap init "ANT Review Card" com.antbogura.reviewcard --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
